<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project case study — A. Majid</title><link rel="stylesheet" href="/cms.css"></head><body class="study"><header><a href="/#projects">← All projects</a><a href="/">A. Majid</a></header><main id="study" aria-live="polite"><p>Loading project…</p></main><footer>Have a project in mind? <a href="/#contact">Let’s talk ↗</a></footer><script type="module">
import {projects,study} from '/cms-data.js';
const root=document.querySelector('#study');try{const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());const p=(await projects()).find(p=>p.slug===slug&&p.published);if(!p){document.title='Project not found — A. Majid';root.innerHTML='<h1>Project not found</h1><p>This project may have moved or is not published yet.</p><a href="/#projects">Back to projects</a>';}else{document.title=p.title+' — A. Majid';root.innerHTML=study(p);}}catch{root.innerHTML='<h1>Unable to load this project</h1><p>Please refresh the page or try again later.</p>';}
</script></body></html>

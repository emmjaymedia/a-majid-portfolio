apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eventflow-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: eventflow-api}
  template:
    metadata:
      labels: {app: eventflow-api}
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: eventflow-api:lab
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: eventflow-solace
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /ready, port: 4000}
          livenessProbe:
            httpGet: {path: /health, port: 4000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eventflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: eventflow-api
spec:
  selector: {app: eventflow-api}
  ports:
    - port: 4000
      targetPort: 4000
